<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="loading-screen">
        <h1>Loading...</h1>
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <p id="loading-percent">0%</p>
        <p id="loading-status">Initializing...</p>
    </section>

    <section id="phone-screen" class="hidden">
        <div class="phone">
            <div class="speaker"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <div class="phone-top"><span id="phone-date">02 AUG 2026</span><span id="phone-clock">00:00</span></div>
            <div class="phone-display">
                <div class="scanline"></div>
                <div class="message-icon"><div class="envelope"><div class="paper"></div><div class="flap"></div></div></div>
                <h2>1 New Message</h2>
                <p>From : HChi</p>
                <button id="open-btn" type="button">OPEN</button>
            </div>
            <div class="navigation-pad">
                <div class="nav-row"><div></div><button class="fake-btn">▲</button><div></div></div>
                <div class="nav-row"><button class="fake-btn">◀</button><button class="fake-btn center-btn">●</button><button class="fake-btn">▶</button></div>
                <div class="nav-row"><div></div><button class="fake-btn">▼</button><div></div></div>
            </div>
            <div class="keypad">
                <button class="key">1</button><button class="key">2</button><button class="key">3</button>
                <button class="key">4</button><button class="key">5</button><button class="key">6</button>
                <button class="key">7</button><button class="key">8</button><button class="key">9</button>
                <button class="key">*</button><button class="key">0</button><button class="key">#</button>
            </div>
        </div>
    </section>

    <section id="decrypt-screen" class="hidden">
        <div class="decrypt-box">
            <h2>Decrypting...</h2>
            <div class="decrypt-bar"><div id="decrypt-progress"></div></div>
            <p id="decrypt-percent">0%</p>
        </div>
    </section>
    <section id="intro-screen" class="hidden">
        <div class="intro-box"><p id="intro-text"></p></div>
    </section>
    <section id="quotes-screen" class="hidden">
        <div class="quotes-bg"></div>
        <div class="quotes-box"><p id="quote-text"></p></div>
    </section>

    <section id="cake-screen" class="hidden">
        <div class="cake-wrapper">
            <img id="cake-img" src="images/cake.png" alt="Birthday Cake">
            <img id="flame" src="images/flame.gif" alt="Flame">
        </div>
        <p id="cake-note">Make a wish <br>Click the flame to blow out the candle</p>
    </section>

    <section id="ending-screen" class="hidden">
        <h1>Hyvää syntymäpäivää ❤️</h1>
        <p>Kiitos, että olet ystäväni.</p>
    </section>

    <canvas id="confetti"></canvas>
    <audio id="bgm" src="music/birthday.mp3" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/quotes.js"></script>
    <script src="js/cake.js"></script>
</body>
</html>
